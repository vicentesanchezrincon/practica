[project]
name = "practica"
version = "0.1.0"
description = "Pipeline medallion Postgres -> S3 con AWS Glue, PySpark y Step Functions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "faker>=30.0",
]

[project.optional-dependencies]
# Se instala solo en local y en CI. En Glue, PySpark ya viene en el runtime.
dev = [
    "pyspark==3.5.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "boto3>=1.35",
]
# Infraestructura: se instala aparte, dentro de infra/
infra = [
    "aws-cdk-lib>=2.160",
    "constructs>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# El wheel que se sube a S3 y se pasa a los jobs de Glue via --extra-py-files
packages = ["src/common"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501", # la longitud de linea ya la gestiona el formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "integration: pruebas que necesitan Postgres o AWS reales (deselect con -m 'not integration')",
]
